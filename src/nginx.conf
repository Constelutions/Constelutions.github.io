# Custom nginx.conf for the Constelutions static site on Coolify.
#
# Goals beyond "serve the files":
#   - server_tokens off + more_clear_headers Server: an attacker gets no
#     "nginx" (let alone a version number) to go CVE-hunting with on a
#     404/500/etc. Requires the nginx-mod-http-headers-more apk package
#     (installed in the Dockerfile) — server_tokens alone only hides the
#     version, not the "nginx" string itself.
#   - error_page directives: every 4xx/5xx nginx itself generates (not just
#     ones the app would have rendered) resolves to our own branded page
#     instead of nginx's stock error page.
#   - brotli/gzip_static: the Dockerfile precompresses every text asset at
#     build time, so the bytes on the wire are brotli -11 / gzip -9 without
#     spending any request-time CPU on them.

load_module modules/ngx_http_headers_more_filter_module.so;
load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;

user nginx;
worker_processes auto;
pid /run/nginx.pid;

# Log to stdout/stderr, not files — Docker only captures the former, and a
# file-only log leaves `docker compose up`/`docker logs` silent forever even
# though nginx is running and serving requests fine.
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Default 8k is easy to exceed on "localhost" in particular, where
    # browsers accumulate cookies from every other local dev server sharing
    # that same "domain" — raise it so a bloated Cookie header doesn't 400.
    client_header_buffer_size 16k;
    large_client_header_buffers 4 16k;

    # Static site: the same handful of files are stat()ed on every request.
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # ------------------------------------------------------------------
    # COMPRESSION
    #
    # The type list is deliberately spelled with BOTH javascript media
    # types. nginx's bundled mime.types maps .js to application/javascript
    # up to 1.25.0 and to text/javascript from 1.25.1 on, and *_types match
    # on the resolved Content-Type — so listing only one means a future
    # Alpine nginx bump silently stops compressing every script on the site.
    #
    # *_static on: prefer the .br/.gz the build stage generated (max quality,
    # zero request-time CPU). The dynamic filters below stay on as the
    # fallback for anything that was not precompressed.
    # ------------------------------------------------------------------
    brotli_static on;
    brotli on;
    brotli_comp_level 5;
    brotli_min_length 256;
    brotli_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/manifest+json
        application/xml
        application/rss+xml
        image/svg+xml;

    gzip_static on;
    gzip on;
    gzip_vary on;
    # nginx's default gzip_comp_level is 1, which left ~15% on the table for
    # every dynamically compressed response.
    gzip_comp_level 6;
    gzip_min_length 256;
    # Coolify fronts this with its own proxy, so requests arrive bearing a
    # Via header; without this nginx would decline to compress them.
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/manifest+json
        application/xml
        application/rss+xml
        image/svg+xml;

    server_tokens off;
    more_clear_headers Server;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Coolify terminates TLS and proxies in to :80, so nginx's own view
        # of scheme/host/port is not the client's. Left on (the default), the
        # directory redirect for /about answered with
        #   Location: http://localhost:80/about/
        # i.e. the internal port, over plain http. Relative Location values
        # are resolved by the browser against the URL it actually requested,
        # which is correct under any proxy.
        absolute_redirect off;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # Astro build output: hashed asset filenames under /_static/ are safe
        # to cache forever; everything else (HTML) should always revalidate.
        #
        # The three security headers are repeated here on purpose. nginx's
        # add_header does NOT merge across levels — a block that declares any
        # add_header of its own inherits none from its parent. Without the
        # repetition, adding Cache-Control below silently stripped nosniff
        # from every script, stylesheet and font on the site (verified with
        # curl -D: the header was present on / and absent on /_static/*.js).
        # One Cache-Control, not two: `expires 1y` emits its own
        # "Cache-Control: max-age=31536000" alongside any add_header of the
        # same name, and the response went out carrying both (curl -D showed
        # two Cache-Control lines). max-age is spelled out here instead.
        location /_static/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }

        # Astro's static build emits clean-URL directories (/about/index.html
        # served at /about/); fall back through the directory index, then a
        # literal .html file, before giving up to the 404 error page.
        location / {
            try_files $uri $uri/ $uri.html =404;
        }

        error_page 403 /errors/403.html;
        error_page 404 /errors/404.html;
        error_page 500 /errors/500.html;
        error_page 502 /errors/502.html;
        error_page 503 /errors/503.html;
        error_page 504 /errors/504.html;

        # internal: only reachable via the error_page redirects above, never
        # by a client requesting /errors/404.html directly.
        location ^~ /errors/ {
            internal;
        }
    }
}
