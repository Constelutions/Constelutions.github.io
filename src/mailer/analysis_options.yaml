include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_return: error
    unused_import: error

# public_member_api_docs is deliberately absent: it targets published
# libraries, and this is a publish_to:none application whose classes are
# documented at type level rather than on every field and constructor.
linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - directives_ordering
    - prefer_final_locals
    - unawaited_futures
