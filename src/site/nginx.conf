# Custom nginx.conf for the Constelutions static site on Coolify.
#
# Goals beyond "serve the files":
#   - server_tokens off + more_clear_headers Server: an attacker gets no
#     "nginx" (let alone a version number) to go CVE-hunting with on a
#     404/500/etc. Requires the nginx-mod-http-headers-more apk package
#     (installed in the Dockerfile) — server_tokens alone only hides the
#     version, not the "nginx" string itself.
#   - error_page directives: every 4xx/5xx nginx itself generates (not just
#     ones the app would have rendered) resolves to our own branded page
#     instead of nginx's stock error page.
#   - brotli/gzip_static: the Dockerfile precompresses every text asset at
#     build time, so the bytes on the wire are brotli -11 / gzip -9 without
#     spending any request-time CPU on them.

load_module modules/ngx_http_headers_more_filter_module.so;
load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;

user nginx;
worker_processes auto;
pid /run/nginx.pid;

# Log to stdout/stderr, not files — Docker only captures the former, and a
# file-only log leaves `docker compose up`/`docker logs` silent forever even
# though nginx is running and serving requests fine.
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    # 1 MB tracks ~16k client IPs — far beyond this site's traffic. 3r/m with
    # burst 5 below: five instant requests (submit -> 400 -> fix -> resubmit
    # -> retry all fit), then one per 20s.
    limit_req_zone $binary_remote_addr zone=contact:1m rate=3r/m;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Default 8k is easy to exceed on "localhost" in particular, where
    # browsers accumulate cookies from every other local dev server sharing
    # that same "domain" — raise it so a bloated Cookie header doesn't 400.
    client_header_buffer_size 16k;
    large_client_header_buffers 4 16k;

    # Static site: the same handful of files are stat()ed on every request.
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # ------------------------------------------------------------------
    # COMPRESSION
    #
    # The type list is deliberately spelled with BOTH javascript media
    # types. nginx's bundled mime.types maps .js to application/javascript
    # up to 1.25.0 and to text/javascript from 1.25.1 on, and *_types match
    # on the resolved Content-Type — so listing only one means a future
    # Alpine nginx bump silently stops compressing every script on the site.
    #
    # *_static on: prefer the .br/.gz the build stage generated (max quality,
    # zero request-time CPU). The dynamic filters below stay on as the
    # fallback for anything that was not precompressed.
    # ------------------------------------------------------------------
    brotli_static on;
    brotli on;
    brotli_comp_level 5;
    brotli_min_length 256;
    brotli_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/manifest+json
        application/xml
        application/rss+xml
        image/svg+xml;

    gzip_static on;
    gzip on;
    gzip_vary on;
    # nginx's default gzip_comp_level is 1, which left ~15% on the table for
    # every dynamically compressed response.
    gzip_comp_level 6;
    gzip_min_length 256;
    # Coolify fronts this with its own proxy, so requests arrive bearing a
    # Via header; without this nginx would decline to compress them.
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/manifest+json
        application/xml
        application/rss+xml
        image/svg+xml;

    server_tokens off;
    more_clear_headers Server;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Coolify terminates TLS and proxies in to :80, so nginx's own view
        # of scheme/host/port is not the client's. Left on (the default), the
        # directory redirect for /about answered with
        #   Location: http://localhost:80/about/
        # i.e. the internal port, over plain http. Relative Location values
        # are resolved by the browser against the URL it actually requested,
        # which is correct under any proxy.
        absolute_redirect off;

        # Coolify's Traefik fronts this container, so $remote_addr is the
        # proxy. Trust X-Forwarded-For only when the request arrives from a
        # private (RFC1918) source — the proxy and docker networks. A client
        # hitting :80 directly has a public $remote_addr, so its forged XFF
        # is ignored entirely. A client going through Coolify can prepend
        # fake entries, but Traefik appends the true client IP last and
        # real_ip_recursive walks right-to-left past trusted addresses only,
        # stopping at the first untrusted one — the genuine client. This is
        # load-bearing for both the rate limit below and Cap's own per-IP
        # limiting: without it every request keys to Coolify's proxy IP.
        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 192.168.0.0/16;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # Astro build output: hashed asset filenames under /_static/ are safe
        # to cache forever; everything else (HTML) should always revalidate.
        #
        # The three security headers are repeated here on purpose. nginx's
        # add_header does NOT merge across levels — a block that declares any
        # add_header of its own inherits none from its parent. Without the
        # repetition, adding Cache-Control below silently stripped nosniff
        # from every script, stylesheet and font on the site (verified with
        # curl -D: the header was present on / and absent on /_static/*.js).
        # One Cache-Control, not two: `expires 1y` emits its own
        # "Cache-Control: max-age=31536000" alongside any add_header of the
        # same name, and the response went out carrying both (curl -D showed
        # two Cache-Control lines). max-age is spelled out here instead.
        location /_static/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }

        # Liveness probe for the container healthcheck and for Coolify's
        # health registration.
        #
        # Deliberately a static response rather than a file read: it answers
        # "is nginx up and serving", which is what a probe every 30s should
        # test. Whether dist/ was populated is settled at build time — the
        # image build fails if `pnpm build` does — so re-checking it forever
        # afterwards buys nothing.
        #
        # `= /healthz` is an exact match, so it costs one hash lookup and
        # never reaches try_files. access_log off keeps a probe every 30s from
        # burying real traffic in the log. No add_header here on purpose, so
        # this location still inherits the server-level security headers.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # ------------------------------------------------------------------
        # CONTACT FORM API
        #
        # Proxied to the mailer container over the compose network. The mailer
        # publishes no ports, so this location is the only route to it and
        # RESEND_API_KEY has no inbound path from the internet.
        # ------------------------------------------------------------------
        location /api/ {
            # Docker's embedded DNS. Going through a *variable* is load-bearing:
            # with a literal proxy_pass, nginx resolves "mailer" once while
            # loading the config and refuses to start at all if that name does
            # not yet resolve — which would take the entire static site down
            # because the contact form's backend was slow to boot. Resolving
            # per request instead degrades a dead mailer to a 503 on /api/.
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $mailer_upstream http://mailer:8080;
            proxy_pass $mailer_upstream$request_uri;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 32k;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;

            # nginx's own rate limit is the escalation for a client that keeps
            # pushing after the mailer's send throttle would already say no —
            # see specs/contact-form-anti-spam.md and fail2ban-ip-bans.md.
            limit_req zone=contact burst=5 nodelay;
            # Default would be 503, indistinguishable from @api_unavailable's
            # "mailer down".
            limit_req_status 429;
            error_page 429 = @api_rate_limited;

            # The mailer sets its own Cache-Control (correct when it is
            # reached directly, e.g. from a test), and add_header APPENDS
            # rather than replaces — so without this the response went out
            # carrying two Cache-Control lines, the same duplicate this file
            # already avoids by not pairing `expires` with add_header.
            # nginx owns response headers at the edge; hide the upstream's.
            proxy_hide_header Cache-Control;

            # This block declares add_header directives of its own, so it
            # inherits NONE from the server block — the same non-merging rule
            # that silently stripped nosniff from /_static/ once. The three
            # security headers have to be restated here.
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;

            # off: pass the mailer's own 4xx/5xx bodies straight through. They
            # are JSON the browser needs (validation errors name the offending
            # fields); intercepting would replace them with branded HTML.
            proxy_intercept_errors off;

            # nginx's OWN failures are a different matter — those would
            # otherwise resolve to the HTML error pages below and arrive at a
            # fetch() expecting JSON.
            error_page 502 503 504 = @api_unavailable;
        }

        location @api_unavailable {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            return 503 '{"error":"unavailable"}';
        }

        # Body matches the mailer's own 429 so main.ts handles both
        # identically.
        location @api_rate_limited {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            return 429 '{"error":"rate_limited"}';
        }

        # ------------------------------------------------------------------
        # CAP CAPTCHA
        #
        # Same-origin proxy to the Cap Standalone container — no CORS, no
        # third-party script, no visitor data leaving this stack. The prefix
        # is stripped: the widget's apiEndpoint is /cap/<site-key>/, Cap
        # serves /<site-key>/…. Variable proxy_pass does no automatic URI
        # mapping, hence the rewrite. See specs/contact-form-anti-spam.md.
        # ------------------------------------------------------------------
        location /cap/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $cap_upstream http://cap:3000;
            rewrite ^/cap/(.*)$ /$1 break;
            proxy_pass $cap_upstream$uri$is_args$args;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # Cap keys its per-IP challenge rate limit on X-Forwarded-For and
            # trusts it as-is, so send ONLY the resolved real client
            # (post-realip), never $proxy_add_x_forwarded_for's spoofable
            # chain.
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 32k;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;

            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;

            proxy_intercept_errors off;
            error_page 502 503 504 = @api_unavailable;
        }

        # Astro's static build emits clean-URL directories (/about/index.html
        # served at /about/); fall back through the directory index, then a
        # literal .html file, before giving up to the 404 error page.
        location / {
            try_files $uri $uri/ $uri.html =404;
        }

        error_page 403 /errors/403.html;
        error_page 404 /errors/404.html;
        error_page 500 /errors/500.html;
        error_page 502 /errors/502.html;
        error_page 503 /errors/503.html;
        error_page 504 /errors/504.html;

        # internal: only reachable via the error_page redirects above, never
        # by a client requesting /errors/404.html directly.
        location ^~ /errors/ {
            internal;
        }
    }
}
