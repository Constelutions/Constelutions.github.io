<svg viewBox="4.6 3 184.94 23.6" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Horizontal lockup: the constellation from logo.svg on the left, the
       "Constelutions" wordmark on the right.

       Type size follows the site header's proportions (20px type against a 28px
       icon). The gap does not: it is measured optically, ink edge to ink edge,
       because the header's 12px gap sits between boxes and the icon's ink fills
       only ~70% of its box — carrying that over reads far too loose once the
       box padding is cropped away.

       The wordmark is Space Grotesk 600 converted to outlines (SIL OFL), so the
       file needs no webfont. That also means it cannot be re-typed: regenerate
       it rather than editing the path data by hand.

       Colors follow the page theme when inlined; the svg:root block pins the
       light-theme values for when the file is opened as its own document. -->
  <style>
    .logo-edge { stroke: var(--accent, #648cf3); }
    .logo-node { fill: var(--accent-2, #68ccf5); }
    .logo-core { fill: var(--star, #e6f4fe); }
    .logo-word { fill: var(--ink, #f2f6fb); }
    .logo-word-accent { fill: var(--accent-2, #68ccf5); }

    svg:root { background: #fff; }
    svg:root .logo-edge { stroke: #375ecf; }
    svg:root .logo-node { fill: #006191; }
    svg:root .logo-core { fill: #1a3040; }
    svg:root .logo-word { fill: #0c111d; }
    svg:root .logo-word-accent { fill: #006191; }
  </style>

  <line class="logo-edge" x1="7" y1="9" x2="16" y2="6" stroke-width="1.1"></line>
  <line class="logo-edge" x1="16" y1="6" x2="25" y2="13" stroke-width="1.1"></line>
  <line class="logo-edge" x1="25" y1="13" x2="19" y2="24" stroke-width="1.1"></line>
  <line class="logo-edge" x1="19" y1="24" x2="7" y2="9" stroke-width="1.1"></line>

  <circle class="logo-node" cx="7" cy="9" r="2.4"></circle>
  <circle class="logo-core" cx="16" cy="6" r="3"></circle>
  <circle class="logo-node" cx="25" cy="13" r="2.1"></circle>
  <circle class="logo-node" cx="19" cy="24" r="2.6"></circle>

