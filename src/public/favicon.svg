<svg viewBox="2.5 1.4 26.8 26.8" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Same constellation as logo.svg (identical node coordinates),
       optically adjusted for favicon sizes: the viewBox crops to the mark's
       bounds instead of the logo's 0 0 32 32 padding, and the nodes are enlarged
       relative to the edges so they still read as distinct stars at 16px.
       Colors are literal (no theme tokens) because a favicon is its own
       document; prefers-color-scheme is the right signal here, since the
       browser's tab strip does follow the OS theme. -->
  <style>
    .logo-edge { stroke: #375ecf; }
    .logo-node { fill: #006191; }
    .logo-core { fill: #1a3040; }

    @media (prefers-color-scheme: dark) {
      .logo-edge { stroke: #648cf3; }
      .logo-node { fill: #68ccf5; }
      .logo-core { fill: #e6f4fe; }
    }
  </style>

  <line class="logo-edge" x1="7" y1="9" x2="16" y2="6" stroke-width="1.6"></line>
  <line class="logo-edge" x1="16" y1="6" x2="25" y2="13" stroke-width="1.6"></line>
  <line class="logo-edge" x1="25" y1="13" x2="19" y2="24" stroke-width="1.6"></line>
  <line class="logo-edge" x1="19" y1="24" x2="7" y2="9" stroke-width="1.6"></line>

  <circle class="logo-node" cx="7" cy="9" r="2.8"></circle>
  <circle class="logo-core" cx="16" cy="6" r="3.4"></circle>
  <circle class="logo-node" cx="25" cy="13" r="2.6"></circle>
  <circle class="logo-node" cx="19" cy="24" r="3.0"></circle>
</svg>
